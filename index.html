<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Touring Radar - Live</title>
    
    <!-- Leaflet CSS & JS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --panel-dark: #1E1E1E;
            --primary: #FF5722;
            --text-light: #E0E0E0;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
        }

        /* Peta Penuh Layar */
        #map {
            width: 100%; height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            cursor: default;
        }

        /* TRIK PETA DARK MODE GRATIS SELAMANYA */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .cursor-crosshair {
            cursor: crosshair !important;
        }

        /* Sidebar Kiri */
        #sidebar {
            position: absolute;
            top: 20px; left: 20px;
            width: 280px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        #sidebar.collapsed {
            transform: translateX(-150%);
        }

        /* Tombol Toggle Menu */
        #btn-toggle {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 999;
            background: var(--panel-dark);
            color: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        h2, h3 { margin: 0; }
        h4 { margin: 15px 0 5px 0; font-size: 14px; color: #bbb;}
        .text-orange { color: var(--primary); }

        .rombongan-list {
            list-style: none; padding: 0; margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .rombongan-item {
            background: #2A2A2A;
            padding: 10px; margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px; height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 8px #4CAF50;
        }

        .role-badge {
            font-size: 11px;
            background: #444;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-action:hover { background: #E64A19; }
        
        .btn-small {
            padding: 8px;
            font-size: 12px;
        }

        /* Overlay Form Masuk */
        #join-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.95);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .join-box {
            background: var(--panel-dark);
            padding: 30px;
            border-radius: 12px;
            width: 90%; max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        input, select {
            width: 100%;
            padding: 12px; margin: 5px 0 10px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2A2A2A;
            color: white;
            box-sizing: border-box;
        }

        #alert-msg {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: #FF9800;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 3000;
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* Marker Kustom via CSS */
        .my-marker {
            background-color: var(--primary);
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
        }
        .friend-marker {
            background-color: #03A9F4;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #03A9F4;
        }
        .checkpoint-marker {
            background-color: #FFC107;
            border: 2px solid white;
            border-radius: 0;
            transform: rotate(45deg);
        }
        .destination-marker {
            background-color: #E91E63;
            border: 2px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
        }
        
        .search-box {
            background: #2A2A2A;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <!-- Overlay Form Identitas -->
    <div id="join-overlay">
        <div class="join-box">
            <h2 class="text-orange">Touring Radar</h2>
            <p>Masukkan identitas sebelum riding</p>
            <input type="text" id="rider-name" placeholder="Nama Anda / Panggilan">
            <select id="rider-role">
                <option value="Road Captain">Road Captain (Depan)</option>
                <option value="Member" selected>Member (Tengah)</option>
                <option value="Sweeper">Sweeper (Belakang)</option>
                <option value="Mekanik">Mekanik / Mobil Backup</option>
            </select>
            <button class="btn-action" id="btn-start">Gas Touring!</button>
        </div>
    </div>

    <!-- Peringatan Sistem -->
    <div id="alert-msg">Mencari sinyal GPS...</div>

    <!-- Tombol Buka Menu -->
    <button id="btn-toggle">☰</button>

    <!-- Sidebar Dashboard -->
    <div id="sidebar" style="display:none;">
        <div class="header">
            <h3><span class="text-orange">Radar</span> Touring</h3>
            <button id="btn-close-sidebar" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✖</button>
        </div>
        
        <div style="margin-bottom: 15px;">
            <p style="margin: 0; font-size: 14px; color: #aaa;">Status: <span style="color:#4CAF50;">Live Terhubung</span></p>
        </div>

        <!-- FITUR BARU: CARI TUJUAN -->
        <div class="search-box">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #aaa;">Tujuan Akhir / Destinasi:</p>
            <input type="text" id="input-destination" placeholder="Misal: Cibadak, Sukabumi..." style="padding: 8px; font-size: 12px;">
            <button class="btn-action btn-small" id="btn-search-dest" style="background: #E91E63;">🔍 Cari & Buat Rute</button>
            <button class="btn-action btn-small" id="btn-clear-route" style="background: #555; display: none; margin-top: 5px;">Hapus Rute</button>
        </div>

        <button class="btn-action" id="btn-checkpoint" style="background:#2196F3; margin-bottom:15px;">📍 Tambah Checkpoint Peta</button>

        <h4>Anggota Aktif</h4>
        <ul class="rombongan-list" id="active-list">
            <!-- Daftar anggota akan masuk dari Firebase -->
        </ul>
    </div>

    <!-- Area Peta -->
    <div id="map"></div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // Konfigurasi Firebase dari akun Anda
        const firebaseConfig = {
            apiKey: "AIzaSyC35owuWmWRZj0fXNYT7XPnJKXha2TeD2I",
            authDomain: "gas-touring.firebaseapp.com",
            databaseURL: "https://gas-touring-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "gas-touring",
            storageBucket: "gas-touring.firebasestorage.app",
            messagingSenderId: "1010968446948",
            appId: "1:1010968446948:web:0b8bd3662dd3f931aea9f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let map, myMarker, myId, userName, userRole;
        let myCurrentLat = 0, myCurrentLng = 0;
        let isAddingCheckpoint = false;
        
        const friendMarkers = {};
        const checkpointMarkers = {};
        
        // Variabel untuk Rute Tujuan
        let destinationMarker = null;
        let routeLine = null;

        // Inisialisasi Peta
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 5);
            
            // Menggunakan OSM Standar (Gratis) yang digelapkan via CSS
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            map.on('click', function(e) {
                if(isAddingCheckpoint) {
                    simpanCheckpointKeFirebase(e.latlng.lat, e.latlng.lng);
                    matikanModeCheckpoint();
                }
            });
        }

        // Mulai Touring
        document.getElementById('btn-start').addEventListener('click', () => {
            const nameInput = document.getElementById('rider-name').value;
            const roleInput = document.getElementById('rider-role').value;

            if(!nameInput) {
                alert("Harap isi nama Anda!");
                return;
            }

            userName = nameInput;
            userRole = roleInput;
            myId = 'user_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

            document.getElementById('join-overlay').style.display = 'none';
            document.getElementById('sidebar').style.display = 'block';
            document.getElementById('btn-toggle').style.display = 'block';
            
            showAlert("Mengaktifkan GPS & Menghubungkan ke Server...");

            const myRef = ref(db, 'users/' + myId);
            onDisconnect(myRef).remove();

            mulaiLacakGPS();
            dengarDatabase();
        });

        // Lacak GPS Realtime
        function mulaiLacakGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        myCurrentLat = lat;
                        myCurrentLng = lng;
                        
                        document.getElementById('alert-msg').style.display = 'none';
                        updateMyMarker(lat, lng);
                        
                        // Jika rute tujuan aktif, perbarui garis rutenya
                        updateRouteLine();

                        set(ref(db, 'users/' + myId), {
                            name: userName,
                            role: userRole,
                            lat: lat,
                            lng: lng,
                            timestamp: Date.now()
                        });
                    },
                    (error) => {
                        showAlert("GPS gagal atau loading lama. Pastikan buka di HP.");
                        console.error(error);
                    },
                    // Setting diubah: lebih ramah untuk Laptop, sangat akurat untuk HP
                    { enableHighAccuracy: false, maximumAge: 10000, timeout: 15000 }
                );
            } else {
                showAlert("Browser Anda tidak mendukung GPS.");
            }
        }

        function updateMyMarker(lat, lng) {
            if (!myMarker) {
                const icon = L.divIcon({ className: 'my-marker', iconSize: [16, 16] });
                myMarker = L.marker([lat, lng], {icon: icon}).addTo(map)
                    .bindPopup(`<b>${userName} (Saya)</b><br>${userRole}`).openPopup();
                map.flyTo([lat, lng], 15);
            } else {
                myMarker.setLatLng([lat, lng]);
            }
        }

        function dengarDatabase() {
            const usersRef = ref(db, 'users');
            onValue(usersRef, (snapshot) => {
                const data = snapshot.val() || {};
                const listEl = document.getElementById('active-list');
                listEl.innerHTML = ''; 

                for (let id in data) {
                    const userData = data[id];
                    const isMe = (id === myId);
                    
                    listEl.innerHTML += `
                        <li class="rombongan-item">
                            <div class="status-dot"></div>
                            <div>
                                <b style="font-size:14px">${userData.name} ${isMe ? '(Saya)' : ''}</b><br>
                                <span class="role-badge">${userData.role}</span>
                            </div>
                        </li>
                    `;

                    if (!isMe) {
                        if (!friendMarkers[id]) {
                            const fIcon = L.divIcon({ className: 'friend-marker', iconSize: [14, 14] });
                            friendMarkers[id] = L.marker([userData.lat, userData.lng], {icon: fIcon}).addTo(map)
                                .bindPopup(`<b>${userData.name}</b><br>${userData.role}`);
                        } else {
                            friendMarkers[id].setLatLng([userData.lat, userData.lng]);
                        }
                    }
                }

                for (let id in friendMarkers) {
                    if (!data[id]) {
                        map.removeLayer(friendMarkers[id]);
                        delete friendMarkers[id];
                    }
                }
            });

            const cpRef = ref(db, 'checkpoints');
            onValue(cpRef, (snapshot) => {
                const data = snapshot.val() || {};
                for (let id in data) {
                    const cp = data[id];
                    if (!checkpointMarkers[id]) {
                        const cpIcon = L.divIcon({ className: 'checkpoint-marker', iconSize: [16, 16] });
                        checkpointMarkers[id] = L.marker([cp.lat, cp.lng], {icon: cpIcon}).addTo(map)
                            .bindPopup(`<b>📍 ${cp.name}</b><br><small>Oleh: ${cp.createdBy}</small>`);
                    }
                }
            });
        }

        // ==========================================
        // FITUR BARU: CARI TUJUAN & BUAT RUTE GARIS
        // ==========================================
        document.getElementById('btn-search-dest').addEventListener('click', () => {
            const query = document.getElementById('input-destination').value;
            if(!query) {
                showAlert("Ketik nama tujuan dulu!");
                return;
            }
            
            if(myCurrentLat === 0) {
                showAlert("Tunggu sampai GPS Anda ditemukan!");
                return;
            }

            showAlert("Mencari lokasi...");
            
            // Pencarian lokasi menggunakan API Nominatim gratis
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`)
                .then(response => response.json())
                .then(data => {
                    if(data && data.length > 0) {
                        const destLat = parseFloat(data[0].lat);
                        const destLng = parseFloat(data[0].lon);
                        const destName = data[0].display_name.split(',')[0]; 
                        
                        setDestination(destLat, destLng, destName);
                        document.getElementById('sidebar').classList.add('collapsed'); // Tutup menu
                    } else {
                        showAlert("Lokasi tidak ditemukan. Coba nama kota yang lebih jelas.");
                    }
                })
                .catch(err => {
                    showAlert("Gagal mencari lokasi. Periksa internet Anda.");
                });
        });

        function setDestination(lat, lng, name) {
            // Hapus tujuan lama jika ada
            if(destinationMarker) map.removeLayer(destinationMarker);
            
            // Buat bendera tujuan
            const destIcon = L.divIcon({ className: 'destination-marker', iconSize: [20, 20] });
            destinationMarker = L.marker([lat, lng], {icon: destIcon}).addTo(map)
                .bindPopup(`<b>🏁 TUJUAN: ${name}</b>`).openPopup();
                
            document.getElementById('btn-clear-route').style.display = 'block';
            showAlert(`Menuju ${name}...`);
            
            // Gambar garis rute dan paskan layar
            updateRouteLine();
            
            // Zoom layar agar titik kita dan titik tujuan terlihat dua-duanya
            const bounds = L.latLngBounds([[myCurrentLat, myCurrentLng], [lat, lng]]);
            map.fitBounds(bounds, { padding: [50, 50] });
        }
        
        function updateRouteLine() {
            if(destinationMarker && myCurrentLat !== 0) {
                // Hapus garis lama
                if(routeLine) map.removeLayer(routeLine);
                
                // Gambar garis baru dari posisi saya ke tujuan
                const destLatLng = destinationMarker.getLatLng();
                routeLine = L.polyline([
                    [myCurrentLat, myCurrentLng],
                    [destLatLng.lat, destLatLng.lng]
                ], {
                    color: '#E91E63', // Warna Pink Merah
                    weight: 4,
                    dashArray: '10, 10' // Garis putus-putus
                }).addTo(map);
            }
        }
        
        document.getElementById('btn-clear-route').addEventListener('click', () => {
            if(destinationMarker) map.removeLayer(destinationMarker);
            if(routeLine) map.removeLayer(routeLine);
            destinationMarker = null;
            routeLine = null;
            document.getElementById('input-destination').value = '';
            document.getElementById('btn-clear-route').style.display = 'none';
            
            // Fokus kembali ke titik saya
            if(myMarker) map.flyTo(myMarker.getLatLng(), 15);
        });
        // ==========================================

        document.getElementById('btn-checkpoint').addEventListener('click', () => {
            isAddingCheckpoint = true;
            document.getElementById('map').classList.add('cursor-crosshair');
            const cpMsg = document.getElementById('alert-msg');
            cpMsg.innerText = "Klik area peta untuk menandai titik";
            cpMsg.style.display = 'block';
            cpMsg.style.background = '#2196F3';
            document.getElementById('sidebar').classList.add('collapsed');
        });

        function simpanCheckpointKeFirebase(lat, lng) {
            let namaTempat = prompt("Nama Checkpoint (Misal: Rest Area / Pom Bensin):");
            if(namaTempat) {
                push(ref(db, 'checkpoints'), {
                    name: namaTempat,
                    lat: lat,
                    lng: lng,
                    createdBy: userName,
                    timestamp: Date.now()
                });
                showAlert("Checkpoint berhasil dibagikan!");
            }
        }

        function matikanModeCheckpoint() {
            isAddingCheckpoint = false;
            document.getElementById('map').classList.remove('cursor-crosshair');
            document.getElementById('alert-msg').style.display = 'none';
        }

        document.getElementById('btn-toggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('collapsed');
        });
        document.getElementById('btn-close-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('collapsed');
        });

        function showAlert(msg) {
            const el = document.getElementById('alert-msg');
            el.innerText = msg;
            el.style.background = '#FF9800';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        initMap();
    </script>
</body>
</html>
